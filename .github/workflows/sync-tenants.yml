name: Sync staging tenants with upstream

# Re-export every tenant in experiments.json from its experiment/<name>
# branch in ginkoemdon/ginkoemdon.github.io, so tenants pick up upstream
# changes once their experiment branch has been rebased on main.
# This workflow does NOT rebase branches — that writes to the production
# repo and stays a manual step (see README.md).
on:
  schedule:
    - cron: "0 14 * * *"  # daily, 09:00 EST / 10:00 EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-export tenants from their experiment branches
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib
          data = json.load(open("experiments.json"))
          for exp in data["experiments"]:
              name = exp["name"]
              branch = exp["branch"]
              subprocess.run(
                  ["bash", "scripts/sync.sh", name],
                  check=False,
              )
          PY
      - name: Commit if anything changed
        run: |
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "Sync staging tenants with upstream [skip ci]"
            git push origin main
          else
            echo "No tenant changes."
          fi
