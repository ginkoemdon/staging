<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">A dense form becoming three clear, ordered steps</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6f1e6"/>
    <stop offset=".55" stop-color="#e9e0cd"/>
    <stop offset="1" stop-color="#d9e6e0"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#f8c05e" stop-opacity=".55"/>
    <stop offset="1" stop-color="#f8c05e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e26c00"/>
    <stop offset="1" stop-color="#a35f3c"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#372c1f" flood-opacity=".18"/>
  </filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#372c1f" flood-opacity=".16"/>
  </filter>
</defs>
<rect width="800" height="450" fill="url(#bg)"/>
<!-- soft wash of light, top right: a glow, not a sun disc -->
<ellipse cx="640" cy="105" rx="190" ry="140" fill="url(#glow)"/>
<!-- dense form, left: tilted panel with a soft shadow, header band, many small lines, a couple of checkboxes and a question mark -->
<g transform="rotate(-2 190 225)" filter="url(#soft)">
  <rect x="70" y="80" width="230" height="290" rx="12" fill="#ffffff"/>
  <path d="M70 92 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v34 h-230 z" fill="#184b44"/>
  <rect x="94" y="96" width="110" height="9" rx="4.5" fill="#ffffff" opacity=".9"/>
  <path d="M300 80 l-24 24 h24 z" fill="#d9e6e0"/>
  <rect x="94" y="146" width="182" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="94" y="172" width="140" height="9" rx="4.5" fill="#d97706"/>
  <rect x="94" y="198" width="182" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="94" y="224" width="112" height="9" rx="4.5" fill="#a35f3c"/>
  <rect x="94" y="250" width="182" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="94" y="276" width="158" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="94" y="302" width="92" height="9" rx="4.5" fill="#d97706"/>
  <rect x="94" y="328" width="182" height="9" rx="4.5" fill="#1e293b"/>
  <rect x="94" y="352" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M98 362 l5 5 l9 -10" fill="none" stroke="#14665a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="352" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="272" cy="362" r="13" fill="#f8c05e"/>
  <text x="272" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#372c1f">?</text>
</g>
<!-- transformation: a sweeping curved arrow, with dots travelling along it -->
<path d="M322 238 C 372 158, 438 158, 492 214" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>
<path d="M492 214 l-4 -22 l22 12 z" fill="#a35f3c" transform="rotate(58 492 214)"/>
<circle cx="352" cy="198" r="6" fill="#e26c00"/>
<circle cx="398" cy="172" r="5" fill="#e26c00" opacity=".65"/>
<circle cx="444" cy="176" r="4" fill="#a35f3c" opacity=".5"/>
<!-- clear ordered steps, right: three rounded cards, staggered like a path -->
<g filter="url(#soft2)">
  <rect x="520" y="96" width="220" height="54" rx="14" fill="#14665a"/>
  <circle cx="548" cy="123" r="14" fill="#fdfbf7"/>
  <text x="548" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#14665a">1</text>
  <rect x="574" y="118" width="138" height="9" rx="4.5" fill="#ffffff" opacity=".9"/>
</g>
<g filter="url(#soft2)">
  <rect x="538" y="192" width="220" height="54" rx="14" fill="#f2c14e"/>
  <circle cx="566" cy="219" r="14" fill="#372c1f"/>
  <text x="566" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f2c14e">2</text>
  <rect x="592" y="214" width="138" height="9" rx="4.5" fill="#372c1f" opacity=".75"/>
</g>
<g filter="url(#soft2)">
  <rect x="520" y="288" width="220" height="54" rx="14" fill="#1e293b"/>
  <circle cx="548" cy="315" r="14" fill="#fdfbf7"/>
  <text x="548" y="321" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e293b">3</text>
  <rect x="574" y="310" width="138" height="9" rx="4.5" fill="#ffffff" opacity=".9"/>
  <circle cx="716" cy="315" r="11" fill="#14665a"/>
  <path d="M711 315 l4 4 l7 -8" fill="none" stroke="#fdfbf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
