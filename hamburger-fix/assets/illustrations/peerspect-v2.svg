<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
<title id="t">Two peers, two viewpoints meeting in one shared eye</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbe3a1"/>
    <stop offset=".5" stop-color="#fdfbf7"/>
    <stop offset="1" stop-color="#cfe3dc"/>
  </linearGradient>
  <radialGradient id="peerL" cx=".38" cy=".32" r=".85">
    <stop offset="0" stop-color="#f6a83c"/>
    <stop offset=".6" stop-color="#e26c00"/>
    <stop offset="1" stop-color="#b84e00"/>
  </radialGradient>
  <radialGradient id="peerR" cx=".62" cy=".32" r=".85">
    <stop offset="0" stop-color="#2f8a76"/>
    <stop offset=".6" stop-color="#14665a"/>
    <stop offset="1" stop-color="#0b4a41"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#f8c05e" stop-opacity=".6"/>
    <stop offset="1" stop-color="#f8c05e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="iris" cx=".42" cy=".38" r=".75">
    <stop offset="0" stop-color="#2f8a76"/>
    <stop offset=".7" stop-color="#14665a"/>
    <stop offset="1" stop-color="#0b4a41"/>
  </radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#372c1f" flood-opacity=".2"/>
  </filter>
</defs>
<rect width="800" height="450" fill="url(#bg)"/>
<!-- two peers: large soft circles, warm tangerine and deep teal, with a light arc on each -->
<g filter="url(#soft)">
  <circle cx="268" cy="228" r="132" fill="url(#peerL)"/>
  <circle cx="532" cy="228" r="132" fill="url(#peerR)"/>
</g>
<path d="M168 160 A132 132 0 0 1 300 106" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".35"/>
<path d="M500 106 A132 132 0 0 1 632 160" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".3"/>
<!-- soft glow behind the shared eye -->
<circle cx="400" cy="228" r="125" fill="url(#glow)"/>
<!-- the shared eye -->
<path d="M140 228 Q400 92 660 228 Q400 364 140 228 Z" fill="#fdfbf7" stroke="#372c1f" stroke-width="10"/>
<circle cx="400" cy="228" r="56" fill="url(#iris)"/>
<circle cx="400" cy="228" r="24" fill="#372c1f"/>
<circle cx="416" cy="212" r="9" fill="#f2c14e"/>
<circle cx="384" cy="208" r="8" fill="#ffffff" opacity=".9"/>
<!-- small accents: a rust leaf, a lizard dot, and a few sparkles, instead of flat squares -->
<ellipse cx="148" cy="98" rx="26" ry="12" fill="#a35f3c" transform="rotate(-32 148 98)"/>
<circle cx="652" cy="332" r="14" fill="#c9c972"/>
<circle cx="96" cy="330" r="5" fill="#f2c14e"/>
<circle cx="706" cy="96" r="5" fill="#14665a"/>
<circle cx="620" cy="72" r="4" fill="#e26c00"/>
<circle cx="182" cy="368" r="4" fill="#14665a"/>
</svg>
