<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated hero — pathfinding, growth, trailblazing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e3e0d8; display: grid; place-items: center; min-height: 100vh; }
  .hero-anim { width: min(640px, 96vw); height: auto; display: block; }
  .mountain { opacity: 0; animation: rise 1.2s ease-out forwards; }
  .m1 { animation-delay: .2s; } .m2 { animation-delay: .55s; } .m3 { animation-delay: .9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .path-draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 3.2s ease-in-out .6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .building { transform-origin: 396px 208px; transform: scaleY(0); animation: grow 1.4s cubic-bezier(.2,.8,.2,1) 2.4s forwards; }
  @keyframes grow { to { transform: scaleY(1); } }
  .bloom { transform-origin: 396px 100px; transform: scale(0) rotate(-18deg); opacity: 0; animation: bloom 1.1s cubic-bezier(.2,.8,.2,1) 3.6s forwards; }
  @keyframes bloom { to { transform: scale(1) rotate(0deg); opacity: 1; } }
  .beacon { animation: pulse 2.4s ease-in-out 4.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .65; transform: scale(1.25); } }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .star.s2 { animation-delay: .8s; } .star.s3 { animation-delay: 1.6s; }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .sun { animation: glow 5s ease-in-out infinite; transform-origin: 528px 72px; }
  @keyframes glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .compass { animation: spin 24s linear infinite; transform-origin: 96px 168px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .mountain, .path-draw, .building, .bloom, .beacon, .star, .sun, .compass { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body>
<svg class="hero-anim" viewBox="0 0 640 240" role="img" aria-label="Animated hero: a path draws itself across coloured mountains to a stepped building that grows, then blooms">
  <rect width="640" height="240" fill="#e3e0d8"/>
  <g class="sun"><path d="M520 52 a36 36 0 1 0 18 62 a28 28 0 1 1 -18 -62z" fill="#f8c05e"/></g>
  <g fill="#3b342f">
    <circle class="star" cx="96" cy="48" r="2.5"/><circle class="star s2" cx="150" cy="28" r="1.8"/><circle class="star s3" cx="430" cy="36" r="2.2"/>
  </g>
  <path class="star s2" d="M120 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#c9c972"/>
  <path class="mountain m1" d="M0 240 L180 108 L300 240 Z" fill="#184b44"/>
  <path class="mountain m1" d="M180 108 L216 152 L180 142 L144 152 Z" fill="#f8c05e"/>
  <path class="mountain m2" d="M220 240 L420 76 L600 240 Z" fill="#a35f3c"/>
  <path class="mountain m2" d="M420 76 L458 122 L420 112 L382 122 Z" fill="#f8c05e"/>
  <path class="mountain m3" d="M470 240 L580 148 L640 208 L640 240 Z" fill="#3b342f"/>
  <path id="trail" class="path-draw" d="M40 216 C 110 200, 150 216, 210 202 S 300 176, 360 180" stroke="#184b44" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" fill="none"/>
  <circle r="6" fill="#e26c00" stroke="#e3e0d8" stroke-width="2">
    <animateMotion dur="3.2s" begin="0.6s" fill="freeze" path="M40 216 C 110 200, 150 216, 210 202 S 300 176, 360 180"/>
  </circle>
  <g class="building">
    <rect x="360" y="180" width="72" height="28" fill="#3b342f"/>
    <rect x="372" y="152" width="48" height="28" fill="#184b44"/>
    <rect x="384" y="124" width="24" height="28" fill="#a35f3c"/>
    <g stroke="#e3e0d8" stroke-width="1.5"><line x1="384" y1="164" x2="408" y2="164"/><line x1="392" y1="136" x2="400" y2="136"/></g>
  </g>
  <g class="bloom">
    <path d="M396 124 C 384 108, 384 96, 396 88 C 408 96, 408 108, 396 124z" fill="#c9c972"/>
    <path d="M396 100 C 386 92, 378 92, 372 98 C 380 104, 390 104, 396 100z" fill="#184b44"/>
    <path d="M396 100 C 406 92, 414 92, 420 98 C 412 104, 402 104, 396 100z" fill="#184b44"/>
  </g>
  <path class="beacon" d="M520 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#e26c00"/>
  <g class="compass" transform="translate(96 168)" stroke="#3b342f" stroke-width="1.5" fill="none">
    <circle r="18"/><path d="M0 -18 L0 18 M-18 0 L18 0 M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5 Z"/>
  </g>
</svg>
</body>
</html>
