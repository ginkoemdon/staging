<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -30 880 510" role="img" aria-labelledby="t">
<title id="t">A dense form tears apart and a curved arrow carries the pieces into three clear steps</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdeeda"/>
    <stop offset=".6" stop-color="#fbd9a8"/>
    <stop offset="1" stop-color="#f6c177"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".28" r=".7">
    <stop offset="0" stop-color="#14665a" stop-opacity=".5"/>
    <stop offset="1" stop-color="#14665a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="amberGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#f2c14e" stop-opacity=".9"/>
    <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f8a76"/>
    <stop offset="1" stop-color="#14665a"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".45"/>
  </filter>
  <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#e26c00"/>
  </marker>
  <!-- tear line, in the panel's own coordinates: left half keeps
       everything left of it, right half everything right of it -->
  <clipPath id="tearL"><polygon points="0,0 180,85 205,160 185,230 215,300 195,365 0,450"/></clipPath>
  <clipPath id="tearR"><polygon points="180,85 205,160 185,230 215,300 195,365 450,450 450,0"/></clipPath>
</defs>
<rect x="-40" y="-30" width="880" height="510" fill="url(#bg)"/>
<ellipse cx="620" cy="120" rx="260" ry="170" fill="url(#glow)"/>
<!-- faint blueprint grid -->
<g stroke="#3b342f" stroke-opacity=".05" stroke-width="1">
  <path d="M-40 90 H840 M-40 180 H840 M-40 270 H840 M-40 360 H840"/>
  <path d="M200 -30 V480 M400 -30 V480 M600 -30 V480"/>
</g>
<!-- dense form, left: white panel, tilted, torn in two with a clear
     gap between the halves, like torn paper, so the pale background
     shows through where it tore -->
<g transform="rotate(-4 180 225)" filter="url(#soft)">
  <g clip-path="url(#tearL)"><g transform="translate(-11,0)">
    <rect x="60" y="85" width="230" height="280" rx="12" fill="#fdfbf7" stroke="#d9cdb2" stroke-width="1.5"/>
    <path d="M60 97 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v30 h-230 z" fill="#14665a"/>
    <rect x="84" y="98" width="110" height="9" rx="4.5" fill="#fdfbf7" opacity=".9"/>
    <rect x="84" y="146" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="172" width="140" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="84" y="198" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="224" width="112" height="9" rx="4.5" fill="#e26c00"/>
    <rect x="84" y="250" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="276" width="158" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="84" y="302" width="92" height="9" rx="4.5" fill="#e26c00"/>
    <rect x="84" y="328" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="94" y="340" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M98 350 l5 5 l9 -10" fill="none" stroke="#14665a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="340" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="272" cy="350" r="13" fill="#f8c05e"/>
    <text x="272" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#372c1f">?</text>
  </g></g>
  <g clip-path="url(#tearR)"><g transform="translate(13,0) rotate(1 200 225)">
    <rect x="60" y="85" width="230" height="280" rx="12" fill="#fdfbf7" stroke="#d9cdb2" stroke-width="1.5"/>
    <path d="M60 97 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v30 h-230 z" fill="#14665a"/>
    <rect x="84" y="98" width="110" height="9" rx="4.5" fill="#fdfbf7" opacity=".9"/>
    <rect x="84" y="146" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="172" width="140" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="84" y="198" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="224" width="112" height="9" rx="4.5" fill="#e26c00"/>
    <rect x="84" y="250" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="84" y="276" width="158" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="84" y="302" width="92" height="9" rx="4.5" fill="#e26c00"/>
    <rect x="84" y="328" width="182" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="94" y="340" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M98 350 l5 5 l9 -10" fill="none" stroke="#14665a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="340" width="20" height="20" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="272" cy="350" r="13" fill="#f8c05e"/>
    <text x="272" y="356" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#372c1f">?</text>
  </g></g>
  <!-- small shards caught in the gap -->
  <rect x="198" y="140" width="11" height="7" rx="1.5" fill="#fdfbf7" stroke="#d9cdb2" stroke-width="1" transform="rotate(18 203 143)"/>
  <rect x="202" y="288" width="9" height="6" rx="1.5" fill="#fdfbf7" stroke="#d9cdb2" stroke-width="1" transform="rotate(-14 206 291)"/>
</g>
<!-- curved arrow: the torn form becomes the clear steps, sweeping
     from the form's edge up to the first step card, above the
     checkbox row so it stays clear of it -->
<path d="M 308 232 C 372 214, 424 172, 486 130" fill="none" stroke="#e26c00" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowHead)"/>
<!-- fragments flying right, getting cleaner -->
<g>
  <rect x="320" y="150" width="46" height="9" rx="4.5" fill="#14665a" transform="rotate(-18 343 154)"/>
  <rect x="350" y="205" width="34" height="9" rx="4.5" fill="#2f8a76" transform="rotate(12 367 209)"/>
  <rect x="330" y="265" width="52" height="9" rx="4.5" fill="#2f8a76" transform="rotate(-8 356 269)"/>
  <rect x="380" y="160" width="26" height="9" rx="4.5" fill="#e26c00" transform="rotate(24 393 164)"/>
  <circle cx="410" cy="230" r="6" fill="#372c1f"/>
  <circle cx="440" cy="185" r="5" fill="#2f8a76"/>
  <circle cx="455" cy="280" r="5" fill="#e26c00"/>
</g>
<!-- reassembled: three clean step cards -->
<g filter="url(#soft)">
  <rect x="500" y="90" width="240" height="58" rx="14" fill="#14665a"/>
  <circle cx="530" cy="119" r="15" fill="#fdfbf7"/>
  <text x="530" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#14665a">1</text>
  <rect x="556" y="114" width="150" height="10" rx="5" fill="#fdfbf7" opacity=".9"/>
</g>
<g filter="url(#soft)">
  <rect x="520" y="190" width="240" height="58" rx="14" fill="#f2c14e" stroke="#df9f4e" stroke-width="1.5"/>
  <circle cx="550" cy="219" r="15" fill="#1e293b"/>
  <text x="550" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f2c14e">2</text>
  <rect x="576" y="214" width="150" height="10" rx="5" fill="#1e293b" opacity=".7"/>
</g>
<g filter="url(#soft)">
  <rect x="500" y="290" width="240" height="58" rx="14" fill="#fdfbf7" stroke="#e0d6c0" stroke-width="1.5"/>
  <circle cx="530" cy="319" r="15" fill="#14665a"/>
  <text x="530" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fdfbf7">3</text>
  <rect x="556" y="314" width="130" height="10" rx="5" fill="#1e293b" opacity=".75"/>
  <circle cx="716" cy="319" r="12" fill="#14665a"/>
  <path d="M710 319 l4 4 l8 -9" fill="none" stroke="#fdfbf7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<circle cx="620" cy="395" r="4" fill="#e26c00"/>
<circle cx="660" cy="405" r="4" fill="#2f8a76"/>
</svg>
